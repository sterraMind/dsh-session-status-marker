- insert:
    - id: session-status-marker
      name: dsh-session-status-marker
      config:
        autoInfer: true
        maxNoteLength: 200
        autoExpireMs: 0
        refreshIntervalMs: 2000
        # Order of the new row-action button and row-menu item. Raise both if
        # another plugin already uses 300; default is 300.
        rowActionOrder: 300
        menuItemOrder: 300
        # Fallback mark when a turn completes normally and nothing else marked
        # the session this turn. Set to true to enable; default is false.
        # turnEndAwaitingAnswer: true
        # Fallback net, a layer separate from autoInfer: a running turn with no
        # mark reads as `todo`, a normally-completed turn with no mark reads as
        # `feedback` (or `pending-subagent` when subagents are still running).
        # Never touches an explicit or inference-produced mark.
        # Enabled by default (schema default true); set false to opt out.
        autoFallback: true
        # How long the system-observation line on a session stays fresh before
        # the picker renders it as outdated, in milliseconds. `0` never expires
        # it. Default is 300000 (five minutes).
        observationTtlMs: 300000