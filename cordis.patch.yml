- insert:
    - id: session-status-marker
      name: dsh-session-status-marker
      config:
        autoInfer: true
        maxNoteLength: 200
        autoExpireMs: 0
        refreshIntervalMs: 2000
        # Order of the new row-action button and row-menu item. Raise both if
        # another plugin already uses 300; default is 300.
        rowActionOrder: 300
        menuItemOrder: 300
        # Fallback mark when a turn completes normally and nothing else marked
        # the session this turn. Set to true to enable; default is false.
        # turnEndAwaitingAnswer: true
